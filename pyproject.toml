[project]
name = "cef-cubic-symmetry"
version = "0.1.0"
description = "Add your description here"
authors = [
    {name = "AlbertFarkhutdinov", email = "albertfarhutdinov@gmail.com"}
]
license = {text = "GPL-3.0"}
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "cycler (<0.13)",
    "matplotlib (<3.11)",
    "numba (<0.62)",
    "numpy (<2.4)",
    "pandas (<2.4)",
    "pretty-repr (<1.1)",
    "scienceplots (<2.2)",
    "scipy (>1.6.1,<1.17)",
]

[dependency-groups]
dev = [
    "isort<7.0",
    "pytest<9.0",
    "pytest-cov<7.0",
    "ruff<0.13",
    "wemake-python-styleguide<1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
